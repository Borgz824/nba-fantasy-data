name: NBA ESPN Collector
on:
  workflow_dispatch:
  schedule:
    # UTC: 05:30, 13:00, 20:30 Asia/Manila (UTC+8)
    - cron: '30 21 * * *'
    - cron: '0 5 * * *'
    - cron: '30 12 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ESPN–Yahoo bridge (offline test)
        run: python -m unittest -v test_bridge.py test_category_engine.py test_matchup_engine.py test_flaim_matchup_adapter.py test_streaming_priorities.py test_add_drop_optimizer.py
      - name: Collect ESPN player game logs
        id: collect
        run: python collect.py
      - name: Upload data and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-season-data-${{ github.run_number }}
          path: output/
          if-no-files-found: warn
          retention-days: 30
