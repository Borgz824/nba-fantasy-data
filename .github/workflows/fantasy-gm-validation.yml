name: Fantasy GM Validation
on:
  push:
    branches:
      - fix/fantasy-40-check-validation
  pull_request:
    paths:
      - 'nba_schedule_validation.py'
      - 'espn_fixture_feed.py'
      - 'gm_readiness.py'
      - 'yahoo_lineup_validation.py'
      - 'yahoo_dated_lineup_audit.py'
      - 'historical_team_resolver.py'
      - 'historical_lineup_pipeline.py'
      - 'completed_fixture_feed.py'
      - 'yahoo_source_capability.py'
      - 'future_lineup_candidates.py'
      - 'add_drop_optimizer.py'
      - 'test_*.py'
      - '.github/workflows/fantasy-gm-validation.yml'
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run schedule and feed tests
        run: python -m unittest -v test_nba_schedule_validation test_espn_fixture_feed test_yahoo_lineup_validation test_optimizer_audit test_yahoo_dated_lineup_audit test_historical_team_resolver test_historical_lineup_pipeline test_completed_fixture_feed test_yahoo_source_capability test_future_lineup_candidates
      - name: Verify source compiles
        run: python -m py_compile nba_schedule_validation.py espn_fixture_feed.py gm_readiness.py add_drop_optimizer.py yahoo_lineup_validation.py yahoo_dated_lineup_audit.py historical_team_resolver.py historical_lineup_pipeline.py completed_fixture_feed.py yahoo_source_capability.py future_lineup_candidates.py
      - name: Live ESPN fixture smoke test
        run: |
          START=$(TZ=America/New_York date +%F)
          python espn_fixture_feed.py --start-date "$START" --end-date "$START" --out /tmp/espn_fixtures.json
          python -c 'import json; d=json.load(open("/tmp/espn_fixtures.json")); assert d["coverage_verified"] and len(d["requested_yahoo_dates"])==1; print("ESPN daily endpoint validated; fixtures:",len(d["games"]))'

      - name: Live historical ESPN completed-game smoke test
        run: |
          python completed_fixture_feed.py --start-date 2026-11-12 --end-date 2026-11-12 --out /tmp/espn_completed_20261112.json
          python -c 'import json; from nba_schedule_validation import NY,parse_utc; d=json.load(open("/tmp/espn_completed_20261112.json")); assert d["coverage_verified"]; assert all(g["status"]=="final" and parse_utc(g["start_utc"]).astimezone(NY).date().isoformat()=="2026-11-12" for g in d["games"]); print("Nov 12 completed NBA games:",len(d["games"]),"; independent completeness not guaranteed")'
      - name: Upload public historical fixture artifact
        uses: actions/upload-artifact@v4
        with:
          name: espn-completed-2026-11-12
          path: /tmp/espn_completed_20261112.json
          retention-days: 7
